<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪刀石頭布｜冒險者挑戰</title>
<style>
  :root { color-scheme: dark; --bg:#101827; --panel:#1b2940; --gold:#ffd166; --muted:#aebbd0; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; color:#f7f9fc;
    background:radial-gradient(circle at top,#263d60 0,#101827 58%); }
  main { width:min(720px,100%); background:rgba(27,41,64,.96); border:1px solid #405575;
    border-radius:22px; padding:clamp(22px,5vw,42px); box-shadow:0 20px 60px #0006; }
  h1 { margin:0 0 8px; text-align:center; color:var(--gold); font-size:clamp(27px,5vw,38px) }
  .sub { text-align:center; color:var(--muted); margin:0 0 28px }
  label { display:block; margin:16px 0 7px; font-weight:650 }
  input { width:100%; padding:13px 14px; border:1px solid #536987; border-radius:11px;
    background:#111d30; color:white; font:inherit; }
  button { border:0; border-radius:12px; padding:13px 18px; font:inherit; font-weight:750;
    cursor:pointer; transition:transform .12s,filter .12s; }
  button:hover { filter:brightness(1.1); transform:translateY(-1px) }
  button:disabled { opacity:.4; cursor:not-allowed; transform:none }
  .primary { background:var(--gold); color:#182235; width:100%; margin-top:20px }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:22px 0 }
  .choice { background:#314766; color:white; border:1px solid #5b7393; font-size:18px; min-height:90px }
  .choice span { display:block; font-size:30px; margin-bottom:5px }
  .status { background:#111d30; border-radius:14px; padding:17px; margin:20px 0; text-align:center }
  .score { display:flex; justify-content:space-around; gap:10px; font-weight:700; font-size:18px }
  .score strong { color:var(--gold); font-size:26px }
  .arena { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0 }
  .fighter { background:#263954; border-radius:14px; padding:15px; text-align:center }
  .fighter .hand { font-size:42px; min-height:52px }
  .fighter small { color:var(--muted) }
  #message { min-height:52px; text-align:center; line-height:1.6; color:#f7d98c }
  #log { max-height:180px; overflow:auto; padding-left:22px; color:var(--muted); font-size:14px }
  .hidden { display:none }
  .actions { display:flex; gap:10px }
  .actions button { flex:1 }
  .secondary { background:#405675; color:white }
  @media(max-width:480px) { .choices {gap:7px}.choice {padding:10px 4px;font-size:15px} }
</style>
</head>
<body>
<main>
  <h1>✊ ✋ ✌️ 剪刀石頭布</h1>
  <p class="sub">冒險者終極大對決｜先獲得 3 勝的一方獲勝！</p>

  <section id="login">
    <label for="playerName">冒險者名字</label>
    <input id="playerName" maxlength="24" placeholder="請輸入你的冒險者名字">
    <label for="equipment">你的使用裝備</label>
    <input id="equipment" maxlength="40" placeholder="例如：黃金鍵盤、魔法魔杖">
    <button class="primary" id="start">開始冒險</button>
  </section>

  <section id="game" class="hidden">
    <div class="status">
      <div id="welcome"></div>
      <div class="score">
        <div>你 <strong id="playerScore">0</strong> 勝</div>
        <div>電腦 <strong id="computerScore">0</strong> 勝</div>
      </div>
      <div id="round">第 1 回合</div>
    </div>
    <div class="arena">
      <div class="fighter"><small>冒險者</small><div class="hand" id="playerHand">❔</div><div id="playerLabel">尚未出拳</div></div>
      <div class="fighter"><small>電腦</small><div class="hand" id="computerHand">🤖</div><div id="computerLabel">等待挑戰</div></div>
    </div>
    <p id="message">請選擇你的拳！</p>
    <div class="choices">
      <button class="choice" data-choice="剪刀"><span>✌️</span>剪刀</button>
      <button class="choice" data-choice="石頭"><span>✊</span>石頭</button>
      <button class="choice" data-choice="布"><span>✋</span>布</button>
    </div>
    <h3>戰鬥紀錄</h3>
    <ol id="log"></ol>
    <div class="actions">
      <button class="secondary" id="restart">重新開始</button>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const hands = {剪刀:"✌️", 石頭:"✊", 布:"✋"};
  let playerWins = 0, computerWins = 0, round = 1, name = "", equipment = "";
  const buttons = [...document.querySelectorAll(".choice")];

  $("start").addEventListener("click", () => {
    name = $("playerName").value.trim();
    equipment = $("equipment").value.trim();
    if (!name || !equipment) {
      alert("請填寫冒險者名字和使用裝備！");
      return;
    }
    $("welcome").textContent = `歡迎勇敢的冒險者【${name}】！你已裝備【${equipment}】，準備迎接挑戰！`;
    $("login").classList.add("hidden");
    $("game").classList.remove("hidden");
    resetGame();
  });

  function updateScore() {
    $("playerScore").textContent = playerWins;
    $("computerScore").textContent = computerWins;
    $("round").textContent = `第 ${round} 回合`;
  }
  function endGame() {
    buttons.forEach(b => b.disabled = true);
    $("message").textContent = playerWins === 3
      ? `🏆 恭喜 ${name} 以 ${playerWins}：${computerWins} 擊敗電腦，成為剪刀石頭布大師！`
      : `💻 很可惜，電腦以 ${computerWins}：${playerWins} 獲得最終勝利，下次再來挑戰吧！`;
  }
  function play(playerChoice) {
    if (playerWins >= 3 || computerWins >= 3) return;
    const options = ["剪刀", "石頭", "布"];
    const computerChoice = options[Math.floor(Math.random() * options.length)];
    $("playerHand").textContent = hands[playerChoice];
    $("computerHand").textContent = hands[computerChoice];
    $("playerLabel").textContent = playerChoice;
    $("computerLabel").textContent = computerChoice;

    let result;
    if (playerChoice === computerChoice) {
      result = "平手！沒有人得分。";
    } else if (
      (playerChoice === "剪刀" && computerChoice === "布") ||
      (playerChoice === "石頭" && computerChoice === "剪刀") ||
      (playerChoice === "布" && computerChoice === "石頭")
    ) {
      playerWins++;
      result = "🎉 這回合你贏了！";
    } else {
      computerWins++;
      result = "💥 這回合電腦贏了！";
    }
    $("message").textContent = result;
    const item = document.createElement("li");
    item.textContent = `第 ${round} 回合：你出${playerChoice}，電腦出${computerChoice}－${result}`;
    $("log").prepend(item);
    round++;
    updateScore();
    if (playerWins === 3 || computerWins === 3) endGame();
  }
  function resetGame() {
    playerWins = 0; computerWins = 0; round = 1;
    $("log").replaceChildren();
    $("playerHand").textContent = "❔";
    $("computerHand").textContent = "🤖";
    $("playerLabel").textContent = "尚未出拳";
    $("computerLabel").textContent = "等待挑戰";
    $("message").textContent = "請選擇你的拳！";
    buttons.forEach(b => b.disabled = false);
    updateScore();
  }
  buttons.forEach(button => button.addEventListener("click", () => play(button.dataset.choice)));
  $("restart").addEventListener("click", resetGame);
})();
</script>
</body>
</html>
